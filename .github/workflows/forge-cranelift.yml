name: Forge Cranelift

on:
  push:
    branches: [forge-minimal, sia32-backend, sia32-m8-relocations, sia32-m7-isa-facilities, sia32-m6-i64-prep]
  workflow_dispatch:

concurrency:
  group: forge-cranelift-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check SIA target lexicon compatibility
        run: cargo test -p target-lexicon@0.13.5-sia.1
      # This compiles the registered SIA32 backend alongside retained native backends.
      - name: Check retained Cranelift workspace and SIA registration
        run: |
          cargo check -p cranelift-codegen --no-default-features --features std,arm64,riscv64,sia32
          cargo check -p cranelift-frontend
          cargo check -p cranelift-module
          cargo check -p cranelift-native
      - name: Test focused SIA32 backend code
        run: |
          cargo test -p cranelift-codegen --lib isa::sia32 --no-default-features --features std,sia32
          cargo test -p cranelift-codegen --test sia32_encode --no-default-features --features std,sia32
