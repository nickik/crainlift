[package]
authors = ["The Cranelift Project Developers"]
name = "cranelift-codegen"
version = "0.137.0-dev"
description = "Low-level code generator library"
license = "Apache-2.0 WITH LLVM-exception"
documentation = "https://docs.rs/cranelift-codegen"
repository = "https://github.com/bytecodealliance/wasmtime"
categories = ["no-std"]
keywords = ["compile", "compiler", "jit"]
build = "build.rs"
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
features = ["all-arch"]

[dependencies]
anyhow = { workspace = true, optional = true, features = ['std'] }
bumpalo = { workspace = true }
capstone = { workspace = true, optional = true }
cranelift-assembler-x64 = { workspace = true }
cranelift-codegen-shared = { path = "./shared", version = "0.137.0-dev" }
cranelift-entity = { workspace = true }
cranelift-bforest = { workspace = true }
cranelift-bitset = { workspace = true }
cranelift-control = { workspace = true }
hashbrown = { workspace = true, features = ["default-hasher"] }
target-lexicon = { workspace = true }
log = { workspace = true }
serde = { workspace = true, optional = true }
serde_derive = { workspace = true, optional = true }
postcard = { workspace = true, optional = true }
gimli = { workspace = true, features = ["write"], optional = true }
smallvec = { workspace = true }
regalloc2 = { workspace = true, features = ["checker"] }
souper-ir = { version = "2.1.0", optional = true }
sha2 = { workspace = true, optional = true }
rustc-hash = { workspace = true }
wasmtime-core = { workspace = true }
libm = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
similar = { workspace = true }
env_logger = { workspace = true }
proptest = { workspace = true }
mutatis = { workspace = true }

[build-dependencies]
cranelift-codegen-meta = { path = "meta", version = "0.137.0-dev" }
cranelift-isle = { path = "../isle/isle", version = "=0.137.0-dev" }

[features]
default = ["std", "unwind", "host-arch", "timing"]
# Forge does not need Cranelift's fuzz-control support just to use std. Keep
# optional Gimli inactive unless an unwind-related feature actually selects it.
std = ["serde?/std", "rustc-hash/std", "gimli?/std"]
core = []
disas = ["anyhow", "capstone"]
trace-log = ["regalloc2/trace-log"]
isle-split-match = []
unwind = ["gimli"]
x86 = []
arm64 = []
s390x = []
riscv64 = []
sia32 = []
# Kept as an empty compatibility feature; this fork intentionally omits Pulley.
pulley = []
host-arch = []
all-arch = ["all-native-arch"]
# SIA32 is now a first-class independently selectable native architecture.
# CLIF lowering remains deliberately unsupported; inclusion here means the
# backend scaffold, target lookup and lowering-independent facilities build.
all-native-arch = ["x86", "arm64", "s390x", "riscv64", "sia32"]
enable-serde = [
    "serde",
    "serde_derive",
    "cranelift-entity/enable-serde",
    "cranelift-bitset/enable-serde",
    "regalloc2/enable-serde",
    "hashbrown/serde",
    "smallvec/serde",
]
incremental-cache = ["enable-serde", "postcard", "sha2"]
souper-harvest = ["souper-ir"]
isle-errors = ["cranelift-isle/fancy-errors"]
timing = []
