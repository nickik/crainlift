[package]
name = "target-lexicon"
version = "0.13.5-sia.1"
edition = "2018"
license = "Apache-2.0 WITH LLVM-exception"
description = "target-lexicon 0.13.5 compatibility layer with SIA32 target support"
publish = false

[dependencies]
target-lexicon-upstream = { package = "target-lexicon", version = "=0.13.5", default-features = false }
serde = { version = "1.0", optional = true }

[features]
default = []
std = ["target-lexicon-upstream/std"]
serde_support = ["serde", "std", "target-lexicon-upstream/serde_support"]
arch_zkasm = ["target-lexicon-upstream/arch_zkasm"]
arch_z80 = ["target-lexicon-upstream/arch_z80"]
