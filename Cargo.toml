[workspace]
resolver = "2"
members = [
  "cranelift/assembler-x64",
  "cranelift/assembler-x64/meta",
  "cranelift/bforest",
  "cranelift/bitset",
  "cranelift/codegen",
  "cranelift/codegen/meta",
  "cranelift/codegen/shared",
  "cranelift/control",
  "cranelift/entity",
  "cranelift/frontend",
  "cranelift/isle/isle",
  "cranelift/module",
  "cranelift/native",
  "cranelift/srcgen",
  "crates/core",
  "vendor/target-lexicon-sia",
]

[workspace.package]
version = "50.0.0-dev"
authors = ["The Cranelift Project Developers"]
edition = "2024"
rust-version = "1.96.0"

[workspace.lints.rust]
unused_extern_crates = "warn"
trivial_numeric_casts = "warn"
unstable_features = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"

[workspace.lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = [
  "cfg(pulley_tail_calls)",
  "cfg(pulley_assume_llvm_makes_tail_calls)",
  "cfg(pulley_disable_interp_simd)",
  "cfg(arc_try_new)",
  "cfg(fuzzing)",
]

[workspace.lints.clippy]
all = { level = "allow", priority = -1 }
clone_on_copy = "warn"
map_clone = "warn"
uninlined_format_args = "warn"
unnecessary_to_owned = "warn"
manual_strip = "warn"
useless_conversion = "warn"
unnecessary_mut_passed = "warn"
unnecessary_fallible_conversions = "warn"
unnecessary_cast = "warn"
allow_attributes_without_reason = "warn"
from_over_into = "warn"
redundant_field_names = "warn"
multiple_bound_locations = "warn"
extra_unused_type_parameters = "warn"

[workspace.dependencies]
# Cranelift packages retained in this fork.
cranelift-assembler-x64 = { path = "cranelift/assembler-x64", version = "0.137.0-dev" }
cranelift-codegen = { path = "cranelift/codegen", version = "0.137.0-dev", default-features = false, features = ["unwind"] }
cranelift-frontend = { path = "cranelift/frontend", version = "0.137.0-dev" }
cranelift-entity = { path = "cranelift/entity", version = "0.137.0-dev" }
cranelift-native = { path = "cranelift/native", version = "0.137.0-dev" }
cranelift-module = { path = "cranelift/module", version = "0.137.0-dev" }
cranelift-bforest = { path = "cranelift/bforest", version = "0.137.0-dev" }
cranelift-bitset = { path = "cranelift/bitset", version = "0.137.0-dev" }
cranelift-control = { path = "cranelift/control", version = "0.137.0-dev", default-features = false }
cranelift-srcgen = { path = "cranelift/srcgen", version = "0.137.0-dev" }
wasmtime-core = { path = "crates/core", version = "=50.0.0-dev", package = "wasmtime-internal-core" }

# Bytecode Alliance dependencies used by Cranelift.
regalloc2 = "0.15.2"
# Thin compatibility layer over upstream 0.13.5 adding Architecture::Sia32.
target-lexicon = { path = "vendor/target-lexicon-sia" }

# External dependencies required by the retained packages.
arbitrary = "1.4.2"
bumpalo = "3.20.2"
mutatis = { version = "0.5.2", features = ["alloc", "derive", "check"] }
gimli = { version = "0.33.0", default-features = false, features = ["read"] }
anyhow = { version = "1.0.103", default-features = false }
env_logger = "0.11.5"
log = { version = "0.4.28", default-features = false }
hashbrown = { version = "0.17", default-features = false }
capstone = { version = "0.14.0", default-features = false, features = ["full", "arch_x86", "arch_riscv", "arch_arm64"] }
xed-sys = "0.6"
smallvec = { version = "1.15.1", features = ["union"] }
similar = "3.1.1"
mach2 = "0.6"
proptest = "1.11.0"
serde = { version = "1.0.228", default-features = false, features = ["alloc"] }
serde_derive = "1.0.228"
libc = { version = "0.2.185", default-features = true }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
criterion = { version = "0.8.2", default-features = false, features = ["html_reports", "rayon"] }
rustc-hash = { version = "2.1.1", default-features = false }
arbtest = "0.3.2"
sha2 = { version = "0.10.2", default-features = false }
libm = "0.2.16"
